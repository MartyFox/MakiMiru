<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- SPEC-007: the shipped previewer serves this page only via the
     makimiru: scheme (model.js) and never via file:; file: stays
     allow-listed here only for tests/page-selftest-runner.js, a
     dev-only harness that loads this same fixed page directly and
     isn't part of the shipped package. CSP is defense-in-depth, not
     the enforcement boundary — that's the scheme handler itself, which
     never serves file:// content regardless of what this policy allows. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src makimiru: file: 'unsafe-inline'; connect-src makimiru: file:; style-src 'unsafe-inline'; img-src makimiru: file: data:; font-src makimiru: file:">
<title>MakiMiru 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2d2d2d; }
  #canvas { width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // Shared with main.js (its post()). ?job=N, set by the thumbnailer, is
  // echoed on every message so a reused WebView can tell this page's
  // messages from a previous page's.
  var __job = new URLSearchParams(location.search).get('job');
  function __post(msg) {
      if (__job)
          msg.job = __job;
      try {
          window.webkit.messageHandlers.makimiru.postMessage(JSON.stringify(msg));
      } catch (e) {
          console.error('postMessage failed: ' + e);
      }
  }
  window.onerror = function (message, source, line) {
      __post({ event: 'error', message: message + ' @ ' + source + ':' + line });
  };
  window.addEventListener('unhandledrejection', function (ev) {
      __post({ event: 'error', message: 'unhandled rejection: ' + ev.reason });
  });
  __post({ event: 'page-loaded' });
</script>
<script>
  import('./main.js').catch(function (e) {
      __post({ event: 'error', message: 'module import failed: ' + e });
  });
</script>
</body>
</html>
